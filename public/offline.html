<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e14" />
    <title>KINU · Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #0b0e14;
        color: #e6edf5;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main {
        max-width: 340px;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 50%;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0 0 22px;
        color: #8a96a8;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 999px;
        background: #b8ff3d;
        color: #0b0e14;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="KINU" />
      <h1>You're offline</h1>
      <p>KINU needs an internet connection for live prices and your wallet. Check your connection and try again.</p>
      <a href="/app">Try again</a>
    </main>
  </body>
</html>
