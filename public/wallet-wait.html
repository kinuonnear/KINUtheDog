<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e14" />
    <title>Opening your wallet…</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0e14;
        color: #8a96a8;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        animation: pulse 1.4s ease-in-out infinite;
      }
      p {
        margin: 14px 0 0;
        font-size: 15px;
      }
      @keyframes pulse {
        50% {
          opacity: 0.45;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <p>Opening your wallet…</p>
    </main>
  </body>
</html>
